format_version: '11'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: react-native

workflows:
  primary:
    summary: Run tests and lint
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - yarn@0:
        inputs:
        - command: install
    - yarn@0:
        inputs:
        - command: test

  build-ios:
    summary: Build iOS .ipa on macOS cloud runner
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - nvm@1:
        inputs:
        - node_version: '18'
    - yarn@0:
        inputs:
        - command: install
    - cocoapods-install@2:
        inputs:
        - is_cache_disabled: false
        - source_root_path: ios
    - xcode-archive@4:
        inputs:
        - project_path: ios/StlMandaueScanner.xcworkspace
        - scheme: StlMandaueScanner
        - configuration: Release
        - export_method: development
        - automatic_code_signing: api-key
    - deploy-to-bitrise-io@2:
        inputs:
        - notify_user_groups: none
        - is_enable_public_page: true
